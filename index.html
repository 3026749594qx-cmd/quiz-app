<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Quiz Assistant：通用交互式刷题器，支持多题库、错题回顾与跨设备进度同步" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Quiz Assistant</title>
    <link rel="stylesheet" href="styles.css?v=20260913f" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <div class="container">
      <header class="header">
        <div class="title">
          <h1>Quiz Assistant</h1>
          <div id="meta" class="meta"></div>
        </div>

        <div class="actions">
          <button id="backHomeBtn" class="btn btn-ghost" type="button" hidden>← 返回</button>
          <button id="toggleModeBtn" class="btn btn-ghost" type="button" hidden>错题回顾</button>
          <button id="resetBtn" class="btn btn-secondary" type="button" hidden>重置进度</button>
        </div>
      </header>

      <main class="card">
        <!-- 主页：题库列表 -->
        <section id="homeView" hidden>
          <div class="home-head">
            <div class="home-title">选择题库开始刷题</div>
            <div class="home-sub">每个题库的进度会分别保存在本机，可导出进度在手机与电脑间同步。</div>
          </div>
          <div id="banksList" class="banks"></div>

          <section class="transfer" aria-label="进度迁移">
            <div class="transfer-title">进度迁移（跨设备）</div>
            <div class="transfer-sub">在电脑上点“复制进度文本”，在手机上粘贴到导入框点“导入进度”即可同步，反之亦然。</div>

            <div class="transfer-actions">
              <button id="exportProgressBtn" class="btn btn-primary" type="button">复制进度文本</button>
              <span id="transferMsg" class="transfer-msg" role="status" aria-live="polite"></span>
            </div>

            <label class="transfer-label" for="exportText">导出文本</label>
            <textarea id="exportText" class="textarea" rows="3" readonly placeholder="点击“复制进度文本”生成"></textarea>

            <label class="transfer-label" for="importText">导入文本</label>
            <textarea id="importText" class="textarea" rows="3" placeholder="把另一台设备复制的文本粘贴到这里"></textarea>
            <div class="transfer-actions">
              <button id="importProgressBtn" class="btn" type="button">导入进度</button>
            </div>
          </section>

          <div id="homeEmpty" class="empty" hidden></div>
        </section>

        <!-- 刷题页 -->
        <section id="quizView" hidden>
          <section class="stats" aria-label="进度">
            <div class="stats-row">
              <div id="progressText" class="progress-text">加载中…</div>
              <button id="prevBtn" class="btn btn-ghost btn-sm" type="button" disabled>← 上一题</button>
            </div>
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
          </section>

          <div id="modeBanner" class="mode-banner" hidden></div>

          <div id="questionArea" hidden>
            <div class="qhead">
              <div id="qIndex" class="qindex"></div>
              <div class="qhead-right">
                <button id="forgiveBtn" class="forgive-btn" type="button" hidden aria-label="将此题标为已会，移出错题集" title="标为已会，移出错题集">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 8h12l-1.1 12.2a2 2 0 0 1-2 1.8H9.1a2 2 0 0 1-2-1.8L6 8zm4 3.5v8h1.6v-8H10zm2.2 0v8h1.6v-8h-1.6zm2.2 0v8H16v-8h-1.6z" />
                  </svg>
                </button>
                <div id="qType" class="qtype"></div>
              </div>
            </div>

            <div id="qStem" class="stem"></div>

            <form id="answerForm" class="form" autocomplete="off">
              <div id="options" class="options"></div>
              <div id="blankInput" class="blank" hidden>
                <label class="blank-label" for="blankText">你的答案</label>
                <input id="blankText" class="input" type="text" placeholder="输入答案" />
              </div>

              <div class="form-actions">
                <button id="submitBtn" class="btn btn-primary" type="submit" hidden>确认答案</button>
                <button id="nextBtn" class="btn btn-primary" type="button" disabled>下一题 →</button>
              </div>
            </form>

            <div id="result" class="result" hidden></div>

            <div class="feedback">
              <button id="feedbackBtn" class="btn btn-ghost" type="button">题目错误反馈</button>
            </div>
          </div>

          <div id="emptyState" class="empty" hidden></div>
        </section>
      </main>

      <footer class="footer">
        <span class="hint"></span>
      </footer>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
